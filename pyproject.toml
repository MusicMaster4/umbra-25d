[project]
name = "umbra-anim"
version = "0.1.0"
description = "2.5D silhouette-and-diorama animation framework for AI agents. Python in, cinematic mp4 out (Blender EEVEE on the GPU)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
umbra = "umbra.cli:main"

[tool.setuptools]
packages = ["umbra"]

[tool.setuptools.package-data]
umbra = ["fonts/*"]
